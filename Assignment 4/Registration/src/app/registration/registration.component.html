<div class="registration-container">
    <div class="registration-card">
        <h2>Register</h2>

        <form (ngSubmit)="onSubmit()" #registrationForm="ngForm">
            <div class="form-group">
                <label for="firstname">First Name</label>
                <input type="text" id="firstname" name="firstname" [(ngModel)]="registrationData.firstname" required>
            </div>

            <div class="form-group">
                <label for="lastname">Last Name</label>
                <input type="text" id="lastname" name="lastname" [(ngModel)]="registrationData.lastname" required>
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" [(ngModel)]="registrationData.email" required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" [(ngModel)]="registrationData.password" required>
            </div>

            <button type="submit" [disabled]="!registrationForm.valid">Sign Up</button>

            <div class="toggle-link">
                <p>Already have an account? <a routerLink="/login">Login here</a></p>
            </div>
        </form>
    </div>
</div>
